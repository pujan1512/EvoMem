services:
  # Backend Web Service
  - type: web
    name: evomem-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false

  # Frontend Static Site
  - type: web
    name: evomem-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_BASE_URL
        sync: false