services:
  # Backend Web Service
  - type: web
    name: ekagraai-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: ekagra_ai_secure_jwt_secret_token_987654321_key
      - key: ADMIN_EMAILS
        value: yprakash_be24@thapar.edu,ppatel_be24@thapar.edu,tkhandelwal_be24@thapar.edu,ryadav3_be24@thapar.edu
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin123

  # Frontend Static Site
  - type: web
    name: ekagraai-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_BASE_URL
        value: https://ekagraai-backend.onrender.com
