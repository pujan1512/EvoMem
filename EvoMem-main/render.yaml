services:
  # Backend Web Service
  - type: web
    name: evomem-backend
    env: node
    rootDir: EvoMem-main/server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: ${PORT}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
      - key: ADMIN_DEFAULT_PASSWORD
        value: ${ADMIN_DEFAULT_PASSWORD}

  # Frontend Static Site
  - type: web
    name: evomem-frontend
    env: static
    rootDir: EvoMem-main/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_BASE_URL
        value: ${VITE_SERVER_BASE_URL}
